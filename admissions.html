<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #1769aa;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1769aa;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        h1 {
            margin-top: 0;
            color: #123b5d;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .add-btn {
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #0d4f82;
        }

        .add-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .filters input {
            flex: 2;
            min-width: 220px;
        }

        .filters select {
            flex: 1;
            min-width: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 1000px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #1769aa;
            color: white;
        }

        tbody tr:hover {
            background: #f1f7fc;
        }

        .admitted {
            background: #d4edda;
            color: #155724;
            padding: 6px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .discharged {
            background: #e2e3e5;
            color: #383d41;
            padding: 6px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .discharge-btn,
        .edit-btn,
        .delete-btn {
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
        }

        .discharge-btn {
            background: #dc3545;
        }

        .discharge-btn:hover {
            background: #b02a37;
        }

        .edit-btn {
            background: #e0a800;
            color: #222;
        }

        .edit-btn:hover {
            background: #c69500;
        }

        .delete-btn {
            background: #343a40;
        }

        .delete-btn:hover {
            background: #1d2124;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .navbar {
                padding: 15px;
                flex-wrap: wrap;
            }

            .box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>📋 Admission Management</h2>

        <button class="back" onclick="goDashboard()">
            ← Dashboard
        </button>
    </div>

    <div class="container">

        <!-- NEW ADMISSION FORM -->

        <div class="box">

            <h1>New Admission</h1>

            <div class="form-grid">

                <div>
                    <label>Patient Name</label>
                    <select id="patientId" required>
                        <option value="">Loading Patients...</option>
                    </select>
                </div>

                <div>
                    <label>Bed ID</label>
                    <input
                        type="number"
                        id="bedId"
                        placeholder="Enter Bed ID"
                        min="1"
                        required>
                </div>

                <div>
                    <label>Admission Date</label>
                    <input
                        type="date"
                        id="admissionDate"
                        required>
                </div>

            </div>

            <button class="add-btn" id="addButton" onclick="addAdmission()">
                + Admit Patient
            </button>

            <p id="message"></p>

        </div>

        <!-- ADMISSION LIST -->

        <div class="box">

            <h1>Admission List</h1>

            <!-- SEARCH AND FILTER -->

            <div class="filters">

                <input
                    type="text"
                    id="searchAdmission"
                    placeholder="Search by Patient Name or Admission ID"
                    oninput="filterAdmissions()">

                <select
                    id="statusFilter"
                    onchange="filterAdmissions()">

                    <option value="">All Status</option>
                    <option value="ADMITTED">Admitted</option>
                    <option value="DISCHARGED">Discharged</option>

                </select>

            </div>

            <table>
                <thead>
                    <tr>
                        <th>Admission ID</th>
                        <th>Patient Name</th>
                        <th>Bed ID</th>
                        <th>Admission Date</th>
                        <th>Discharge Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="admissionTable">
                    <tr>
                        <td colspan="7">Loading admissions...</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

    <script>

        let allAdmissions = [];
        let patientMap = {};

        // LOAD PATIENTS INTO DROPDOWN

        async function loadPatients() {

            const select = document.getElementById("patientId");

            try {

                const response = await fetch("/api/patients");

                if (!response.ok) {
                    throw new Error("Unable to load patients");
                }

                const patients = await response.json();

                select.innerHTML =
                    '<option value="">Select Patient</option>';

                patientMap = {};

                patients.forEach(patient => {

                    patientMap[String(patient.id)] = patient.name;

                    const option = document.createElement("option");

                    option.value = patient.id;
                    option.textContent = patient.name;

                    select.appendChild(option);

                });

                if (patients.length === 0) {
                    select.innerHTML =
                        '<option value="">No patients found</option>';
                }

            } catch (error) {

                console.error("Patient Load Error:", error);

                select.innerHTML =
                    '<option value="">Failed to load patients</option>';
            }
        }


        // LOAD ADMISSIONS

        async function loadAdmissions() {

            const table = document.getElementById("admissionTable");

            try {

                const [admissionResponse, patientResponse] =
                    await Promise.all([
                        fetch("/api/admissions"),
                        fetch("/api/patients")
                    ]);

                if (!admissionResponse.ok || !patientResponse.ok) {
                    throw new Error("Unable to load data");
                }

                allAdmissions = await admissionResponse.json();

                const patients = await patientResponse.json();

                patientMap = {};

                patients.forEach(patient => {
                    patientMap[String(patient.id)] = patient.name;
                });

                // Newest admission first
                allAdmissions.sort((a, b) => b.id - a.id);

                filterAdmissions();

            } catch (error) {

                console.error("Admission Load Error:", error);

                table.innerHTML = `
                    <tr>
                        <td colspan="7">
                            Unable to load admission list.
                        </td>
                    </tr>
                `;
            }
        }


        // SEARCH AND FILTER ADMISSIONS

        function filterAdmissions() {

            const searchValue =
                document.getElementById("searchAdmission")
                    .value.toLowerCase().trim();

            const statusValue =
                document.getElementById("statusFilter").value;

            const filteredAdmissions = allAdmissions.filter(admission => {

                const patientName =
                    patientMap[String(admission.patientId)] || "Unknown Patient";

                const matchesSearch =
                    String(admission.id).includes(searchValue) ||
                    patientName.toLowerCase().includes(searchValue);

                const matchesStatus =
                    !statusValue || admission.status === statusValue;

                return matchesSearch && matchesStatus;
            });

            displayAdmissions(filteredAdmissions);
        }


        // DISPLAY ADMISSION TABLE

        function displayAdmissions(admissions) {

            const table = document.getElementById("admissionTable");

            table.innerHTML = "";

            if (admissions.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="7">No matching admissions found.</td>
                    </tr>
                `;

                return;
            }

            admissions.forEach(admission => {

                const patientName =
                    patientMap[String(admission.patientId)] || "Unknown Patient";

                const status = admission.status || "-";

                const statusClass =
                    status === "ADMITTED"
                        ? "admitted"
                        : status === "DISCHARGED"
                            ? "discharged"
                            : "";

                const admissionDate = admission.admissionDate || "-";
                const dischargeDate = admission.dischargeDate || "-";
                const bedId = admission.bedId ?? "-";

                let action = "";

                // Actions for admitted patients
                if (status === "ADMITTED") {

                    action += `
                        <button class="discharge-btn"
                            onclick="dischargePatient(${admission.id})">
                            Discharge
                        </button>

                        <button class="edit-btn"
                            onclick="editAdmission(${admission.id})">
                            Edit
                        </button>
                    `;
                }

                // Delete button
                action += `
                    <button class="delete-btn"
                        onclick="deleteAdmission(${admission.id})">
                        Delete
                    </button>
                `;

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${admission.id}</td>
                    <td>${escapeHTML(patientName)}</td>
                    <td>${bedId}</td>
                    <td>${escapeHTML(admissionDate)}</td>
                    <td>${escapeHTML(dischargeDate)}</td>
                    <td>
                        <span class="${statusClass}">
                            ${escapeHTML(status)}
                        </span>
                    </td>
                    <td>${action}</td>
                `;

                table.appendChild(row);

            });
        }


        // BASIC HTML ESCAPING FOR DISPLAYED TEXT

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // ADD NEW ADMISSION

        async function addAdmission() {

            const button = document.getElementById("addButton");
            const message = document.getElementById("message");

            const patientId =
                document.getElementById("patientId").value;

            const bedId =
                document.getElementById("bedId").value;

            const admissionDate =
                document.getElementById("admissionDate").value;

            if (!patientId || !bedId || !admissionDate) {

                message.innerText = "Please fill all fields.";
                message.style.color = "red";

                return;
            }

            const admission = {
                patientId: Number(patientId),
                bedId: Number(bedId),
                admissionDate: admissionDate,
                dischargeDate: "",
                status: "ADMITTED"
            };

            button.disabled = true;
            button.innerText = "Processing...";

            try {

                const response = await fetch("/api/admissions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(admission)
                });

                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(errorText || "Admission failed");
                }

                message.innerText =
                    "Patient admitted successfully!";

                message.style.color = "green";

                document.getElementById("patientId").value = "";
                document.getElementById("bedId").value = "";
                document.getElementById("admissionDate").value = "";

                await loadAdmissions();

            } catch (error) {

                console.error(error);

                message.innerText =
                    "Admission failed: " + error.message;

                message.style.color = "red";

            } finally {

                button.disabled = false;
                button.innerText = "+ Admit Patient";
            }
        }


        // DISCHARGE PATIENT

        async function dischargePatient(id) {

            if (!confirm("Are you sure you want to discharge this patient?")) {
                return;
            }

            try {

                const response = await fetch(
                    "/api/admissions/discharge/" + id,
                    {
                        method: "PUT"
                    }
                );

                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(errorText || "Discharge failed");
                }

                alert("Patient discharged successfully!");

                await loadAdmissions();

            } catch (error) {

                console.error(error);

                alert("Unable to discharge patient: " + error.message);
            }
        }


        // EDIT ADMISSION

        async function editAdmission(id) {

            const admission = allAdmissions.find(item => item.id === id);

            if (!admission) {
                alert("Admission record not found.");
                return;
            }

            const newPatientId = prompt(
                "Enter Patient ID:",
                admission.patientId
            );

            if (newPatientId === null) return;

            const newBedId = prompt(
                "Enter Bed ID:",
                admission.bedId
            );

            if (newBedId === null) return;

            const newDate = prompt(
                "Enter Admission Date (YYYY-MM-DD):",
                admission.admissionDate
            );

            if (newDate === null) return;

            if (!newPatientId || !newBedId || !newDate) {
                alert("Please fill all fields.");
                return;
            }

            if (!Number.isInteger(Number(newPatientId)) ||
                Number(newPatientId) <= 0 ||
                !Number.isInteger(Number(newBedId)) ||
                Number(newBedId) <= 0) {

                alert("Please enter valid Patient ID and Bed ID.");
                return;
            }

            const updatedAdmission = {
                patientId: Number(newPatientId),
                bedId: Number(newBedId),
                admissionDate: newDate
            };

            try {

                const response = await fetch(`/api/admissions/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(updatedAdmission)
                });

                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(errorText || "Update failed");
                }

                alert("Admission updated successfully!");

                await loadAdmissions();

            } catch (error) {

                console.error(error);

                alert("Unable to update admission: " + error.message);
            }
        }


        // DELETE ADMISSION

        async function deleteAdmission(id) {

            if (!confirm(
                "Are you sure you want to delete this admission record?"
            )) {
                return;
            }

            try {

                const response = await fetch(`/api/admissions/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(errorText || "Delete failed");
                }

                alert("Admission deleted successfully!");

                await loadAdmissions();

            } catch (error) {

                console.error(error);

                alert("Unable to delete admission: " + error.message);
            }
        }


        // BACK TO DASHBOARD

        function goDashboard() {

            window.location.href = "dashboard.html";
        }


        // INITIAL PAGE LOAD

        loadPatients();
        loadAdmissions();

    </script>

</body>
</html>
