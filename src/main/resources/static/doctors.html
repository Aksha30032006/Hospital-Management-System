<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #1769aa;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1769aa;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .add-btn,
        .cancel-btn {
            margin-top: 20px;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #1769aa;
        }

        .add-btn:hover {
            background: #0d4f82;
        }

        .cancel-btn {
            background: #777;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1769aa;
            color: white;
        }

        tr:hover {
            background: #f1f7fc;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 2px;
        }

        .edit-btn {
            background: #e0a000;
        }

        .delete-btn {
            background: #dc3545;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid,
            .filters {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .navbar {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🏥 Doctor Management</h2>

        <button class="back" onclick="goDashboard()">
            ← Dashboard
        </button>
    </div>

    <div class="container">

        <!-- Add / Edit Doctor Form -->
        <div class="form-box">

            <h1 id="formTitle">Add New Doctor</h1>

            <div class="form-grid">

                <div>
                    <label>Doctor Name *</label>
                    <input type="text" id="name"
                           placeholder="Enter doctor name">
                </div>

                <div>
                    <label>Specialization *</label>
                    <input type="text" id="specialization"
                           placeholder="Example: Cardiology">
                </div>

                <div>
                    <label>Phone</label>
                    <input type="text" id="phone"
                           placeholder="Enter phone number">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email"
                           placeholder="Enter email">
                </div>

            </div>

            <button class="add-btn" id="submitBtn" onclick="saveDoctor()">
                + Add Doctor
            </button>

            <button class="cancel-btn" id="cancelBtn"
                    onclick="cancelEdit()" style="display:none;">
                Cancel
            </button>

            <p id="message"></p>

        </div>

        <!-- Doctor List -->
        <div class="table-box">

            <h1>Doctor List</h1>

            <div class="filters">

                <input type="text" id="searchInput"
                       placeholder="🔍 Search by Doctor ID or Name..."
                       oninput="filterDoctors()">

                <select id="specializationFilter"
                        onchange="filterDoctors()">
                    <option value="">All Specializations</option>
                </select>

            </div>

            <p id="doctorCount">Loading doctors...</p>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="doctorTable"></tbody>
                </table>

            </div>

        </div>

    </div>

    <script>
        let allDoctors = [];
        let editingDoctorId = null;

        // Load doctors from backend
        async function loadDoctors() {
            try {
                const response = await fetch("/api/doctors");

                if (!response.ok) {
                    throw new Error("Unable to load doctors");
                }

                allDoctors = await response.json();

                loadSpecializations();
                filterDoctors();

            } catch (error) {
                console.error(error);

                document.getElementById("doctorTable").innerHTML =
                    `<tr><td colspan="6" class="no-data">
                        Failed to load doctors. Please refresh.
                    </td></tr>`;

                document.getElementById("doctorCount").innerText =
                    "Unable to load doctor list.";
            }
        }

        // Create specialization filter options
        function loadSpecializations() {
            const select =
                document.getElementById("specializationFilter");

            const previousValue = select.value;

            const specializations = [
                ...new Set(
                    allDoctors
                        .map(d => String(d.specialization ?? "").trim())
                        .filter(s => s !== "")
                )
            ];

            select.innerHTML =
                '<option value="">All Specializations</option>';

            specializations.sort().forEach(specialization => {
                const option = document.createElement("option");
                option.value = specialization;
                option.textContent = specialization;
                select.appendChild(option);
            });

            if (specializations.includes(previousValue)) {
                select.value = previousValue;
            }
        }

        // Search and specialization filter
        function filterDoctors() {
            const search = document.getElementById("searchInput")
                .value.trim().toLowerCase();

            const specialization =
                document.getElementById("specializationFilter").value;

            const filtered = allDoctors.filter(doctor => {
                const id = String(doctor.id ?? "").toLowerCase();
                const name = String(doctor.name ?? "").toLowerCase();

                const matchesSearch =
                    id.includes(search) || name.includes(search);

                const matchesSpecialization =
                    specialization === "" ||
                    String(doctor.specialization ?? "").trim() === specialization;

                return matchesSearch && matchesSpecialization;
            });

            displayDoctors(filtered);
        }

        // Display doctor table
        function displayDoctors(doctors) {
            const table = document.getElementById("doctorTable");
            table.innerHTML = "";

            document.getElementById("doctorCount").innerText =
                `Showing ${doctors.length} of ${allDoctors.length} doctors`;

            if (doctors.length === 0) {
                table.innerHTML =
                    `<tr><td colspan="6" class="no-data">
                        No doctors found.
                    </td></tr>`;
                return;
            }

            doctors.forEach(doctor => {
                const row = document.createElement("tr");

                [
                    doctor.id,
                    doctor.name,
                    doctor.specialization,
                    doctor.phone,
                    doctor.email
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "-";
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");

                const editBtn = document.createElement("button");
                editBtn.textContent = "✏️ Edit";
                editBtn.className = "edit-btn";
                editBtn.onclick = () => editDoctor(doctor.id);

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "🗑️ Delete";
                deleteBtn.className = "delete-btn";
                deleteBtn.onclick = () => deleteDoctor(doctor.id);

                actionCell.appendChild(editBtn);
                actionCell.appendChild(deleteBtn);
                row.appendChild(actionCell);

                table.appendChild(row);
            });
        }

        // Add or update doctor
        async function saveDoctor() {
            const name = document.getElementById("name").value.trim();
            const specialization =
                document.getElementById("specialization").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();

            const message = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            if (!name || !specialization) {
                message.style.color = "red";
                message.innerText =
                    "Please enter doctor name and specialization.";
                return;
            }

            const doctor = {
                name,
                specialization,
                phone,
                email
            };

            const isEditing = editingDoctorId !== null;

            const url = isEditing
                ? `/api/doctors/${editingDoctorId}`
                : "/api/doctors";

            const method = isEditing ? "PUT" : "POST";

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            try {
                const response = await fetch(url, {
                    method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(doctor)
                });

                if (!response.ok) {
                    throw new Error("Unable to save doctor");
                }

                message.style.color = "green";
                message.innerText = isEditing
                    ? "Doctor updated successfully!"
                    : "Doctor added successfully!";

                resetForm();
                await loadDoctors();

            } catch (error) {
                console.error(error);

                message.style.color = "red";
                message.innerText =
                    "Failed to save doctor. Please try again.";

            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText =
                    editingDoctorId !== null
                        ? "Update Doctor"
                        : "+ Add Doctor";
            }
        }

        // Edit doctor
        function editDoctor(id) {
            const doctor = allDoctors.find(
                d => String(d.id) === String(id)
            );

            if (!doctor) return;

            editingDoctorId = doctor.id;

            document.getElementById("name").value = doctor.name ?? "";
            document.getElementById("specialization").value =
                doctor.specialization ?? "";
            document.getElementById("phone").value = doctor.phone ?? "";
            document.getElementById("email").value = doctor.email ?? "";

            document.getElementById("formTitle").innerText = "Edit Doctor";
            document.getElementById("submitBtn").innerText = "Update Doctor";
            document.getElementById("cancelBtn").style.display =
                "inline-block";

            document.getElementById("message").innerText = "";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // Delete doctor
        async function deleteDoctor(id) {
            const confirmed = confirm(
                `Are you sure you want to delete Doctor ID ${id}?`
            );

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/doctors/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error("Doctor not found.");
                    }

                    throw new Error(
                        "Delete failed. This doctor may have linked records."
                    );
                }

                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText =
                    "Doctor deleted successfully!";

                if (String(editingDoctorId) === String(id)) {
                    resetForm();
                }

                await loadDoctors();

            } catch (error) {
                console.error(error);

                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText = error.message;
            }
        }

        // Cancel editing
        function cancelEdit() {
            resetForm();
            document.getElementById("message").innerText = "";
        }

        // Reset form
        function resetForm() {
            editingDoctorId = null;

            document.getElementById("name").value = "";
            document.getElementById("specialization").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("email").value = "";

            document.getElementById("formTitle").innerText =
                "Add New Doctor";

            document.getElementById("submitBtn").innerText =
                "+ Add Doctor";

            document.getElementById("cancelBtn").style.display = "none";
        }

        // Back to dashboard
        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        // Initial load
        loadDoctors();
    </script>

</body>
</html>
